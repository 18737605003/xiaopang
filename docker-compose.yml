version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-platform-postgres
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-platform-network

  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-platform-network

  mongodb:
    image: mongo:6
    container_name: ai-platform-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-platform-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-platform-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/ai_platform
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - mongodb
    networks:
      - ai-platform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-platform-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-platform-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  ai-platform-network:
    driver: bridge
